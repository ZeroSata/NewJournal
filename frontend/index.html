<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Альтернативный фронтенд электронного журнала Top Academy: React + Vite, тёмная тема, дедлайны, PWA" />
    <meta name="theme-color" content="#0e7f92" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Journal — электронный дневник</title>
    <script>
      // Применяем сохранённую тему до первого рендера, чтобы не было вспышки
      try {
        var s = JSON.parse(localStorage.getItem('journal.settings') || '{}');
        var t = s.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { /* noop */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

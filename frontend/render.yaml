# Blueprint для Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: journal-react
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      # Пароль на весь сайт (рекомендуется). Render спросит значение при создании.
      - key: SITE_PASSWORD
        sync: false
